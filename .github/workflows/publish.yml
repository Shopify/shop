name: publish

on:
  push:
    branches: [main]
  # For when the world changed since the last push: a publication that stopped at a gate (a
  # private repository, a registry outage) is started again by hand, through the same approval.
  workflow_dispatch:

# One publication at a time; a second merge waits for the first.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # gh release create
  id-token: write # trusted publishing; no registry token is stored

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The environment's required reviewer approves each publication.
    environment:
      name: npm-shop
      url: https://www.npmjs.com/package/@shopify/shop
    steps:
      # Depth 2 so the release commit, the merge's second parent, is present: the Release step reads
      # its body as the notes, and a depth-1 checkout has no second parent to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # Public runners: the pinned public action is the host setup here.
      # nosemgrep: use-setup-javascript-action
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # Trusted publishing (OIDC and automatic provenance) requires `npm` 11.5.1 or newer.
      - name: Require a publisher with trusted publishing (11.5.1 or newer)
        run: |
          node --input-type=module - <<'EOF'
          import { execFileSync } from 'node:child_process';
          const v = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [maj, min, pat] = v.split('.').map(Number);
          const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
          if (!ok) { console.error(`npm ${v} lacks trusted publishing; need >= 11.5.1`); process.exit(1); }
          console.log(`npm ${v}`);
          EOF

      # The same gate pull requests pass, on the exact tree being published.
      - name: Verify the tree being published
        run: node .github/scripts/verify.mjs

      # Read visibility after approval, not from the event's older snapshot. A failed or malformed
      # lookup is not permission to publish. Each destination checks its own result below.
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'EOF'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const repo = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}`], { encoding: 'utf8' }));
          assert.equal(repo.full_name, process.env.GITHUB_REPOSITORY);
          assert.equal(typeof repo.private, 'boolean');
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(name, '@shopify/shop');
          assert.match(version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=${version.includes('-') ? 'next' : 'latest'}\nprivate=${repo.private}\n`);
          EOF

      # Provenance attestations require a public repository; a private one gets a dry run only.
      - name: Refuse publication from a private repository
        if: steps.plan.outputs.private == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          # `npm` is the registry's own client and the one that performs trusted publishing.
          # nosemgrep: disallow-npm-npx
          npm publish --dry-run --access public --ignore-scripts --tag "$TAG"
          echo "::notice::Publication of @shopify/shop@$VERSION skipped: this repository is private, and provenance attestations require a public one. Only the dry run above ran."

      # One pack with lifecycle scripts disabled, outside the checkout. Publish this exact file and attach it
      # to the Release; a later run must reproduce its bytes or fail, never substitute a new pack.
      - name: Pack once
        if: steps.plan.outputs.private == 'false'
        id: pack
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          node --input-type=module - <<'EOF'
          import { appendFileSync, mkdirSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const directory = `${process.env.RUNNER_TEMP}/pack`;
          mkdirSync(directory, { recursive: true });
          // nosemgrep: disallow-npm-npx
          const report = JSON.parse(execFileSync('npm', ['pack', '--json', '--ignore-scripts', '--pack-destination', directory], { encoding: 'utf8' }));
          assert.equal(report.length, 1);
          const [pack] = report;
          assert.equal(pack.name, '@shopify/shop');
          assert.equal(pack.version, process.env.VERSION);
          assert.equal(pack.filename, `shopify-shop-${process.env.VERSION}.tgz`);
          const tarball = `${directory}/${pack.filename}`;
          const integrity = `sha512-${createHash('sha512').update(readFileSync(tarball)).digest('base64')}`;
          assert.equal(pack.integrity, integrity);
          appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${tarball}\n`);
          EOF

      # An existing registry version says nothing about the Release, its asset, or ClawHub.
      # It must match this pack's identity and integrity. Do not republish it or reapply its dist-tag.
      - name: Ensure registry publication
        if: steps.plan.outputs.private == 'false'
        id: registry
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          NPM_TOKEN: ""
          NODE_AUTH_TOKEN: ""
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          node --input-type=module - <<'EOF'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const { VERSION: version, TAG: tag, TARBALL: tarball } = process.env;
          const integrity = `sha512-${createHash('sha512').update(readFileSync(tarball)).digest('base64')}`;
          const base = 'https://registry.npmjs.org/@shopify%2Fshop';
          async function lookup(selector) {
            const response = await fetch(`${base}/${selector}`, { headers: { accept: 'application/json' }, signal: AbortSignal.timeout(15_000) });
            if (response.status === 404) return null;
            assert.equal(response.status, 200, `registry returned ${response.status}`);
            const document = await response.json();
            assert.ok(document && typeof document === 'object' && !Array.isArray(document), 'registry returned a malformed document');
            return document;
          }
          function matches(document) {
            assert.equal(document?.name, '@shopify/shop');
            assert.equal(document.version, version);
            assert.equal(document.dist?.integrity, integrity, 'npm version has conflicting tarball bytes');
          }
          const existing = await lookup(version);
          if (existing !== null) {
            matches(existing);
            console.log(`::notice::@shopify/shop@${version} already has the intended bytes; the registry is unchanged.`);
          } else {
            // A stale, still-unpublished stable version must not roll latest backwards. Stop
            // rather than inventing a different dist-tag or publishing and restoring a tag.
            if (tag === 'latest') {
              const latest = await lookup('latest');
              if (latest !== null) {
                assert.equal(latest.name, '@shopify/shop');
                const core = (value) => {
                  assert.match(value, /^\d+\.\d+\.\d+(?:\+[0-9A-Za-z.-]+)?$/);
                  return value.split('+')[0].split('.').map(BigInt);
                };
                const a = core(version), b = core(latest.version);
                const differing = a.findIndex((part, index) => part !== b[index]);
                assert.ok(differing >= 0 && a[differing] > b[differing], 'publication would replace a newer or equal latest identity');
              }
            }
            // --provenance fails instead of shipping without an attestation; scripts never run.
            // nosemgrep: disallow-npm-npx
            execFileSync('npm', ['publish', tarball, '--access', 'public', '--ignore-scripts', '--provenance', '--tag', tag], { stdio: 'inherit' });
            matches(await lookup(version));
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `existed=${existing !== null}\n`);
          EOF

      # Check the exact tag's Release independently of npm. Draft-first keeps a new Release
      # unpublished until the required asset is complete. Resume an interrupted draft or upload;
      # preserve existing notes, and never clobber an asset or reset an existing Release's latest.
      - name: Ensure Release and required tarball asset
        if: steps.plan.outputs.private == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          NPM_EXISTED: ${{ steps.registry.outputs.existed }}
        run: |
          node --input-type=module - <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync, spawnSync } from 'node:child_process';
          import { basename } from 'node:path';
          import assert from 'node:assert/strict';
          const { GITHUB_REPOSITORY: repo, GITHUB_SHA: sha, VERSION: version, TAG: tag, TARBALL: tarball } = process.env;
          const releaseTag = `v${version}`, root = `repos/${repo}`;
          const gh = (...args) => execFileSync('gh', args, { encoding: 'utf8' });
          const api = (path) => JSON.parse(gh('api', path));
          // Successful, complete lists establish absence, including drafts; no catch-all 404 or
          // swallowed CLI error can turn failed authorization or a broken network into absence.
          const list = (path) => {
            const pages = JSON.parse(gh('api', '--paginate', '--slurp', `${path}?per_page=100`));
            assert.ok(Array.isArray(pages) && pages.every(Array.isArray));
            return pages.flat();
          };
          function findRelease() {
            const found = list(`${root}/releases`).filter((item) => item.tag_name === releaseTag);
            assert.ok(found.length <= 1, 'duplicate Release identity');
            return found[0];
          }
          function hasMatchingTag() {
            const refs = api(`${root}/git/matching-refs/tags/${releaseTag}`);
            assert.ok(Array.isArray(refs));
            const found = refs.filter((ref) => ref.ref === `refs/tags/${releaseTag}`);
            assert.ok(found.length <= 1);
            // The Commits API resolves lightweight and annotated tags; qualify the tag so a
            // same-name branch cannot supply the commit. No custom tag-object peeling.
            if (found.length) assert.equal(api(`${root}/commits/tags/${releaseTag}`).sha, sha, 'tag points to another commit');
            return found.length === 1;
          }
          function checkIdentity(release) {
            assert.equal(release.tag_name, releaseTag);
            assert.equal(release.prerelease, tag === 'next', 'conflicting prerelease identity');
            assert.equal(typeof release.draft, 'boolean');
            if (!hasMatchingTag()) {
              assert.equal(release.draft, true, 'published Release is missing its tag');
              assert.equal(api(`${root}/commits/${release.target_commitish}`).sha, sha, 'draft targets another commit');
            }
          }
          let release = findRelease();
          if (!release) {
            hasMatchingTag(); // an existing conflicting tag must fail before creating a draft
            // Reuse the release commit's body; a merge carries it on its second parent.
            const parent = spawnSync('git', ['rev-parse', '--verify', '-q', 'HEAD^2'], { encoding: 'utf8' });
            if (parent.error) throw parent.error;
            assert.ok(parent.status === 0 || parent.status === 1, 'cannot read release parent');
            const notes = ghNotes(parent.status === 0 ? parent.stdout.trim() : 'HEAD');
            function ghNotes(commit) { return execFileSync('git', ['log', '-1', '--format=%b', commit], { encoding: 'utf8' }); }
            const notesPath = `${process.env.RUNNER_TEMP}/notes.md`;
            writeFileSync(notesPath, notes);
            const args = ['release', 'create', releaseTag, '--draft', '--target', sha];
            if (tag === 'next') args.push('--prerelease');
            if (notes.trim()) args.push('--notes-file', notesPath); else args.push('--generate-notes');
            gh(...args);
            release = findRelease();
            assert.ok(release, 'created Release not visible');
          }
          checkIdentity(release);
          const bytes = readFileSync(tarball), filename = basename(tarball);
          function findAsset() {
            const found = list(`${root}/releases/${release.id}/assets`).filter((asset) => asset.name === filename);
            assert.ok(found.length <= 1, 'duplicate required asset');
            return found[0];
          }
          function checkAsset(asset) {
            assert.equal(asset.state, 'uploaded', 'required asset is incomplete; refusing replacement');
            assert.equal(asset.size, bytes.length, 'required asset has conflicting size');
            const downloaded = execFileSync('gh', ['api', `${root}/releases/assets/${asset.id}`, '-H', 'Accept: application/octet-stream'], { maxBuffer: 64 * 1024 * 1024 });
            assert.ok(bytes.equals(downloaded), 'required asset has conflicting bytes');
          }
          let asset = findAsset();
          if (!asset) {
            gh('release', 'upload', releaseTag, tarball); // no --clobber
            asset = findAsset();
            assert.ok(asset, 'uploaded asset not visible');
          }
          checkAsset(asset);
          if (release.draft) {
            // Repairs never claim latest, even when a newer version has shipped since this run.
            const body = { draft: false, target_commitish: sha, make_latest: tag === 'latest' && process.env.NPM_EXISTED === 'false' ? 'legacy' : 'false' };
            execFileSync('gh', ['api', '--method', 'PATCH', `${root}/releases/${release.id}`, '--input', '-'], { input: JSON.stringify(body), stdio: ['pipe', 'inherit', 'inherit'] });
            release = findRelease();
            assert.ok(release, 'published Release not visible');
            checkIdentity(release);
            assert.equal(release.draft, false, 'Release remains a draft');
          }
          console.log(`::notice::${releaseTag} and ${filename} have the intended identity and bytes.`);
          EOF

      # ClawHub (clawhub.ai/shopify/skills/shop) keeps a copy of skills/shop per version and cannot
      # point at a repository. Its changelog uses the Release's current notes, including edits.
      # A version held for security review may be invisible even to its owner: the exact-version
      # already-exists refusal remains the success case for a rerun, not a byte-verification claim.
      # ClawHub's trusted publishing covers packages, not skills; this environment secret is the
      # workflow's one stored credential. No separate tag command re-promotes an older release.
      - name: Publish to ClawHub
        if: steps.plan.outputs.private == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          CLAWHUB_CONFIG_PATH: ${{ runner.temp }}/clawhub-config.json
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          node --input-type=module - <<'EOF'
          import { writeFileSync } from 'node:fs';
          import { execFileSync, spawnSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const { CLAWHUB_TOKEN: token, VERSION: version, TAG: tag } = process.env;
          assert.ok(token, 'CLAWHUB_TOKEN is not set on the npm-shop environment; ClawHub was not published.');
          writeFileSync(process.env.CLAWHUB_CONFIG_PATH, JSON.stringify({ registry: 'https://clawhub.ai', token }) + '\n', { mode: 0o600 });
          // A failed notes read must fail, not silently replace the changelog with fallback text.
          const notes = execFileSync('gh', ['release', 'view', `v${version}`, '--json', 'body', '--jq', '.body'], { encoding: 'utf8' }).trim();
          const changelog = `@shopify/shop ${version}${notes ? `\n\n${notes}` : ''}\n\nhttps://github.com/Shopify/shop/releases/tag/v${version}`;
          // The registry's own client, exact-pinned and executed rather than installed.
          // nosemgrep: disallow-npm-npx
          const result = spawnSync('npx', ['--yes', 'clawhub@0.23.3', 'skill', 'publish', './skills/shop', '--owner', 'shopify', '--slug', 'shop', '--name', 'Shop', '--version', version, '--tags', tag, '--changelog', changelog, '--no-input', '--json'], { encoding: 'utf8' });
          if (result.error) throw result.error;
          process.stdout.write(result.stdout || '');
          process.stderr.write(result.stderr || '');
          if (result.status === 0) process.exit(0);
          // 0.23.3 http.js buildHttpErrorMessage appends only these ordered rate details.
          // Match the literal version and entire refusal; unrelated text is never success.
          const refusal = (result.stderr || '').trim();
          const rateSuffix = /^ \((?:retry in \d+s(?:, remaining: \d+\/\d+)?(?:, reset in \d+s)?|remaining: \d+\/\d+(?:, reset in \d+s)?|reset in \d+s)\)$/;
          const duplicate = [ `Version ${version} already exists`, `Error: Version ${version} already exists` ].some((message) => {
            if (!refusal.startsWith(message)) return false;
            const suffix = refusal.slice(message.length);
            return suffix === '' || rateSuffix.test(suffix);
          });
          if (result.status !== null && duplicate) {
            console.log(`::notice::ClawHub already has @shopify/shop ${version}; nothing to publish there.`);
            process.exit(0);
          }
          process.exit(1);
          EOF
