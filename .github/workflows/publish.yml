name: publish

on:
  push:
    branches: [main]
  # For when the world changed since the last push: a publication that stopped at a gate (a
  # private repository, a registry outage) is started again by hand, through the same approval.
  workflow_dispatch:

# One publication at a time; a second merge waits for the first.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # gh release create
  id-token: write # trusted publishing; no registry token is stored

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The environment's required reviewer approves each publication.
    environment:
      name: npm-shop
      url: https://www.npmjs.com/package/@shopify/shop
    steps:
      # Depth 2 so the release commit, the merge's second parent, is present: the Release step reads
      # its body as the notes, and a depth-1 checkout has no second parent to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # Public runners: the pinned public action is the host setup here.
      # nosemgrep: use-setup-javascript-action
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # Trusted publishing (OIDC and automatic provenance) requires `npm` 11.5.1 or newer.
      - name: Require a publisher with trusted publishing (11.5.1 or newer)
        run: |
          node --input-type=module - <<'EOF'
          import { execFileSync } from 'node:child_process';
          const v = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [maj, min, pat] = v.split('.').map(Number);
          const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
          if (!ok) { console.error(`npm ${v} lacks trusted publishing; need >= 11.5.1`); process.exit(1); }
          console.log(`npm ${v}`);
          EOF

      # The same gate pull requests pass, on the exact tree being published.
      - name: Verify the tree being published
        run: node .github/scripts/verify.mjs

      # Reads the version, asks the registry whether it exists, picks the dist-tag, and asks GitHub
      # whether the repository is private now: the event payload is a snapshot taken when the run
      # was created, and a run that waited at the approval gate through a visibility change would
      # otherwise judge the repository it no longer is.
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRIVATE="$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)"
          export PRIVATE
          node --input-type=module - <<'EOF' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${name.replace('/', '%2F')}/${version}`, { headers: { accept: 'application/json' }, signal: AbortSignal.timeout(15_000) });
          if (response.status !== 200 && response.status !== 404) throw new Error(`registry returned ${response.status} for ${name}@${version}`);
          console.log(`version=${version}`);
          console.log(`published=${response.status === 200}`);
          console.log(`tag=${version.includes('-') ? 'next' : 'latest'}`);
          console.log(`private=${process.env.PRIVATE}`);
          EOF

      # Provenance attestations require a public repository; a private one gets a dry run only.
      - name: Refuse publication from a private repository
        if: steps.plan.outputs.private == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          # `npm` is the registry's own client and the one that performs trusted publishing.
          # nosemgrep: disallow-npm-npx
          npm publish --dry-run --access public --ignore-scripts --tag "$TAG"
          echo "::notice::Publication of @shopify/shop@$VERSION skipped: this repository is private, and provenance attestations require a public one. Only the dry run above ran."

      - name: Skip an already published version
        if: steps.plan.outputs.private != 'true' && steps.plan.outputs.published == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: echo "::notice::@shopify/shop@$VERSION is already on the registry; nothing to publish."

      # --ignore-scripts: the package declares no lifecycle scripts, and none may run here.
      # --provenance: explicit, because npm's automatic OIDC provenance is best-effort; a publish that cannot attest fails instead of shipping without provenance.
      - name: Publish
        if: steps.plan.outputs.private != 'true' && steps.plan.outputs.published != 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          NPM_TOKEN: ""
          NODE_AUTH_TOKEN: ""
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          # `npm` is the registry's own client and the one that performs trusted publishing.
          # nosemgrep: disallow-npm-npx
          npm publish --access public --ignore-scripts --provenance --tag "$TAG"

      # Attaches the packed tarball to a GitHub Release whose notes are the release commit's body
      # (the text the pull request carried); prereleases carry the next tag.
      - name: Release
        if: steps.plan.outputs.private != 'true' && steps.plan.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          # The same packer that published, so the release asset is the published bytes.
          # `npm pack` does not create its destination directory (`pnpm pack` does).
          mkdir -p "$RUNNER_TEMP/pack"
          # nosemgrep: disallow-npm-npx
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"
          # A merge commit's body is empty; the release text is on its second parent's tip.
          notes="$RUNNER_TEMP/notes.md"
          git log -1 --format=%b "$(git rev-parse --verify -q HEAD^2 || echo HEAD)" > "$notes"
          args=()
          if [ "$TAG" = next ]; then args+=(--prerelease); fi
          if [ -s "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          gh release create "v$VERSION" "${args[@]}" "$RUNNER_TEMP"/pack/*.tgz

      # ClawHub (clawhub.ai/shopify/skills/shop) keeps a copy of skills/shop per version and cannot
      # point at a repository, so the copy is made here, from the tree just published, and numbered
      # with the package version: `@shopify/shop` on ClawHub names the CLI release whose binary
      # embeds the same text (`shop skill`). The changelog is the GitHub Release's notes, read back
      # from the Release so edits made to it are carried too.
      # A version under ClawHub's post-publish security review is invisible to every read, even the
      # owner's, so there is no existence check to make beforehand: the server's refusal of a version
      # it already has is the check, and the success case for a run started again by hand.
      # ClawHub's trusted publishing covers packages, not skills: this is the one stored credential
      # in this workflow, an environment secret released only to runs the required reviewer approved.
      - name: Publish to ClawHub
        if: steps.plan.outputs.private != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          CLAWHUB_CONFIG_PATH: ${{ runner.temp }}/clawhub-config.json
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::error::CLAWHUB_TOKEN is not set on the npm-shop environment; ClawHub was not published."
            exit 1
          fi
          node --input-type=module - <<'EOF_CONFIG'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.CLAWHUB_CONFIG_PATH, JSON.stringify({ registry: 'https://clawhub.ai', token: process.env.CLAWHUB_TOKEN }) + '\n', { mode: 0o600 });
          EOF_CONFIG
          changelog="@shopify/shop $VERSION"
          notes="$(gh release view "v$VERSION" --json body --jq .body 2>/dev/null || true)"
          if [ -n "$notes" ]; then changelog="$changelog"$'\n\n'"$notes"; fi
          changelog="$changelog"$'\n\n'"https://github.com/Shopify/shop/releases/tag/v$VERSION"
          err="$RUNNER_TEMP/clawhub-publish.err"
          # The registry's own client, exact-pinned and executed rather than installed.
          # nosemgrep: disallow-npm-npx
          if npx --yes clawhub@0.23.3 skill publish ./skills/shop \
               --owner shopify --slug shop --name Shop \
               --version "$VERSION" --tags "$TAG" --changelog "$changelog" \
               --no-input --json 2> "$err"; then
            cat "$err" >&2
            exit 0
          fi
          cat "$err" >&2
          if grep -qF "Version $VERSION already exists" "$err"; then
            echo "::notice::ClawHub already has @shopify/shop $VERSION; nothing to publish there."
            exit 0
          fi
          exit 1
